# SFT Layer Sweep: early/middle/late
# Sweeps across different layer positions to replicate mentor's full experiment
#
# This tests the hypothesis that layer position affects performance:
# - Early layers (0-7): Low-level features, tokenization patterns
# - Middle layers (8-15): Mid-level representations, syntax
# - Late layers (16-23): High-level semantics, reasoning
#
# Mentor's baseline results (for reference):
# - early:  MMLU 0.44, GSM8K 0.25
# - middle: (need to measure)
# - late:   (need to measure)

name: sft_layer_sweep_qwen25-0.5b
method: sft
model: qwen25-0.5b
dataset: mmlu_gsm8k_combined
prompt: combined_mmlu_gsm8k

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  learning_rate: 5.0e-5
  num_train_epochs: 1
  max_steps: null
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 1024
  logging_steps: 25
  save_strategy: "no"
  lr_scheduler_type: cosine
  warmup_steps: 29  # 5% of ~581 total steps (matches mentor's warmup_ratio=0.05)
  # Mentor-specific hyperparameters (explicit match to notebook)
  optim: paged_adamw_8bit
  packing: false
  dataset_text_field: text
  fp16: true

data:
  max_train_samples: null
  max_eval_samples: null

evaluation:
  max_new_tokens: 512
  batch_size: 8
  temperature: 0.0

seeds: [42]

# Sweep across layer positions
sweep:
  lora.location: [early, middle, late]
