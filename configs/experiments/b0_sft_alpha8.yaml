# B0 SFT arm: alpha=8, 3 seeds
# Produces collapse adapters for Module 8 comparison
#
# Finding: B0 collapse reproduced at α=8 (not α=1 as pilot expected)
# - Alpha=1: 69.3% accuracy, 262 tokens (minimal collapse)
# - Alpha=8: 53.3% accuracy, 87 tokens (strong collapse signature)

name: b0_sft_alpha8
method: sft

# Model and data - B0 spec
model: qwen25-1.5b
dataset: gsm8k
prompt: chat_gsm8k
load_in_4bit: true

# LoRA configuration - CORRECTED to alpha=8
lora:
  rank: 1           # Rank-1 ICV
  alpha: 8          # α=8 where collapse actually occurs
  dropout: 0.0
  location: all     # All layers
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Data splits - B0 spec
data:
  max_train_samples: 512    # B0: 512 training problems
  max_eval_samples: 150     # B0: 150 held-out
  subsample_seed: null      # Take first N, no shuffling

# Evaluation settings
evaluation:
  max_new_tokens: 512
  batch_size: 8
  temperature: 0.0          # Greedy for pass@1
  top_p: 0.95

# Training configuration
training:
  learning_rate: 1.0e-4         # Pilot: 1e-4
  num_train_epochs: 2           # 2 epochs = 64 steps
  max_steps: -1                 # Let epochs control

  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1

  max_length: 1536

  optim: adamw_torch
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 0
  lr_scheduler_type: linear

  bf16: true
  fp16: false

  dataset_text_field: text
  packing: false

  logging_steps: 8

  # Save the adapter
  save_strategy: "steps"
  save_steps: 64            # Save at the end (step 64)
  save_total_limit: 1       # Keep only final adapter
  output_dir: "./b0_adapters/sft_alpha8"

# Run all 3 seeds
seeds: [42, 123, 456]

# Expected outputs (3 adapters):
# ./b0_adapters/sft_alpha8/seed_42/checkpoint/
# ./b0_adapters/sft_alpha8/seed_123/checkpoint/
# ./b0_adapters/sft_alpha8/seed_456/checkpoint/
