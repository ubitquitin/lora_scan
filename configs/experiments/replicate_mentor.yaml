# Replication of mentor's qwen 0.5b combined MMLU + GSM8K setup
# Goal: MMLU ~0.445, GSM8K ~0.31
#
# Key parameters from mentor's notebook:
# - LoRA: r=8, alpha=16, dropout=0.05, late 8 layers (blocks 16-23)
# - Training: LR=5e-5, 1 epoch, batch=4, grad_accum=4
# - Combined training: MMLU (1816) + GSM8K (7473) = 9289 examples
# - Separate prompts: chat_gsm8k (with system prompt) for GSM8K, chat for MMLU
# - Eval: MMLU test (456 examples), GSM8K test (200 examples)

name: replicate_mentor
method: sft
model: qwen25-0.5b

# Sweep both datasets - train on combined, evaluate on both
datasets:
  - mmlu
  - gsm8k

# Separate prompts for each dataset
prompts:
  mmlu: chat              # No system prompt for MMLU
  gsm8k: chat_gsm8k       # Includes system prompt for math tutor

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  location: late  # 8 late layers (blocks 16-23)
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]  # Includes MLP

training:
  learning_rate: 5.0e-5
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4  # Effective batch = 16
  max_length: 1024
  logging_steps: 25
  save_strategy: "no"
  lr_scheduler_type: cosine
  warmup_ratio: 0.05

data:
  # Use full training sets for both
  max_train_samples: null  # MMLU: 1816, GSM8K: 7473 → combined: 9289
  max_eval_samples:
    mmlu: null     # Full test set (456 examples)
    gsm8k: 200     # Mentor uses 200 for eval

evaluation:
  max_new_tokens: 512
  batch_size:
    mmlu: 8      # Mentor uses 8 for MMLU eval
    gsm8k: 32    # Mentor uses 32 for GSM8K eval
  temperature: 0.0

seeds: [42]
