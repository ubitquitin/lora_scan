# NOTE: This config won't work as intended!
#
# The mentor's notebook trains on MMLU+GSM8K COMBINED, but lora_scan trains
# one dataset at a time. Also, the sweep system can't handle dataset-specific
# parameter overrides.
#
# **Recommended approach**: Run the two separate configs instead:
#   - configs/experiments/replicate_mentor_mmlu.yaml
#   - configs/experiments/replicate_mentor_gsm8k.yaml
#
# This combined config is kept for reference but will create 4 combinations
# (cartesian product) instead of the intended 2:
#   mmlu+chat, mmlu+chat_gsm8k, gsm8k+chat, gsm8k+chat_gsm8k

name: replicate_mentor
method: sft
model: qwen25-0.5b
dataset: gsm8k  # will be swept
prompt: chat    # will be swept

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  location: late  # 8 late layers (blocks 16-23)
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  learning_rate: 5.0e-5
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 1024
  logging_steps: 25
  save_strategy: "no"
  lr_scheduler_type: cosine
  warmup_ratio: 0.05

data:
  max_train_samples: null
  max_eval_samples: null

evaluation:
  max_new_tokens: 512
  batch_size: 8
  temperature: 0.0

seeds: [42]

# This creates cartesian product: 2 datasets × 2 prompts = 4 runs
# Not ideal, but demonstrates the sweep format
sweep:
  dataset: [mmlu, gsm8k]
  prompt: [chat, chat_gsm8k]
