# TRUE replication of mentor's qwen 0.5b setup
# Trains on MMLU + GSM8K combined (9289 examples) just like the mentor's notebook
# Goal: MMLU ~0.445, GSM8K ~0.31
#
# Key parameters from mentor's notebook:
# - LoRA: r=8, alpha=16, dropout=0.05, late 8 layers (blocks 16-23)
# - Training: LR=5e-5, 1 epoch, batch=4, grad_accum=4
# - Combined training: MMLU (1816) + GSM8K (7473) = 9289 examples
# - Separate prompts: chat_gsm8k (with system prompt) for GSM8K, chat for MMLU

name: replicate_mentor_combined
method: sft
model: qwen25-0.5b
dataset: mmlu_gsm8k_combined
prompt: combined_mmlu_gsm8k

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  location: late  # 8 late layers (blocks 16-23)
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  learning_rate: 5.0e-5
  num_train_epochs: 1
  max_steps: null  # Override defaults.yaml - use num_train_epochs instead
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4  # Effective batch = 16
  max_length: 1024
  logging_steps: 25
  save_strategy: "no"
  lr_scheduler_type: cosine
  warmup_steps: 29  # ~5% of 580 total steps (9289 samples / 16 effective batch)

data:
  max_train_samples: null  # Use full combined training set (9289 examples)
  max_eval_samples: null   # Evaluate on full test sets

evaluation:
  max_new_tokens: 512
  batch_size: 8  # Will work for both MMLU and GSM8K evaluation
  temperature: 0.0

seeds: [42]
