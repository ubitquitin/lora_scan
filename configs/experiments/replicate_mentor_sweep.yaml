# Layer sweep experiment to match mentor's results
# Trains on MMLU + GSM8K combined across different layer configurations
# Goal: Match mentor's exact numbers (MMLU 0.445, GSM8K 0.31)
#
# Mentor's target results:
# - mmlu_accuracy: 0.445175438596491
# - gsm8k_accuracy: 0.31 (0-shot, no examples)
#
# Testing configurations: all, random, early, late

name: replicate_mentor_layer_sweep
method: sft
model: qwen25-0.5b
dataset: mmlu_gsm8k_combined
prompt: combined_mmlu_gsm8k

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  location: all  # Base value; will be swept
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  learning_rate: 5.0e-5
  num_train_epochs: 1
  max_steps: null  # Use num_train_epochs instead
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4  # Effective batch = 16
  max_length: 1024
  logging_steps: 25
  save_strategy: "no"
  lr_scheduler_type: cosine
  warmup_steps: 29  # 5% of ~581 total steps (matches mentor's warmup_ratio=0.05)
  # Mentor-specific hyperparameters
  optim: paged_adamw_8bit
  packing: false
  dataset_text_field: text
  bf16: true  # Mentor uses bf16 (MMLU 0.445, GSM8K 0.31)
  fp16: false


data:
  max_train_samples: null  # Use full combined training set
  max_eval_samples: null

evaluation:
  max_new_tokens: 512
  batch_size: 8
  temperature: 0.0

seeds: [42]

sweep:
  lora.location: [all, random, early, late]
