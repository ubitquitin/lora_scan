# Sweep config that creates only the 2 correct combinations
# Uses conditional prompts via sweep list format

name: replicate_mentor
method: sft
model: qwen25-0.5b

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  location: late
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  learning_rate: 5.0e-5
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 1024
  logging_steps: 25
  save_strategy: "no"
  lr_scheduler_type: cosine
  warmup_ratio: 0.05

evaluation:
  max_new_tokens: 512
  temperature: 0.0

seeds: [42]

# Just sweep the dataset - each dataset gets default settings from its config
sweep:
  dataset: [mmlu, gsm8k]
