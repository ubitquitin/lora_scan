# Merged underneath every experiment. Experiments only state what differs.
# NOTE: All training requires GPU. Batch sizes are optimized for ~12-24GB VRAM.
lora:
  rank: 1
  alpha: 32
  dropout: 0.0
  location: late
  # target_modules: [q_proj, v_proj]   # optional override of the model default

data:
  max_train_samples: null   # null = full split
  max_eval_samples: null
  subsample_seed: 0         # FIXED so every run sees the same items (needed for paired tests)

evaluation:
  max_new_tokens: 512
  batch_size: 64            # Increased for GPU; reduce if OOM
  temperature: 0.0

reproducibility:
  include_git_commit: true  # git commit becomes part of the run hash

# Per-method defaults. Every key under `training` is passed straight through
# to trl's SFTConfig / GRPOConfig, so any TrainingArguments option works.
# GPU-optimized batch sizes (adjust based on your VRAM):
#   - 24GB: use defaults
#   - 16GB: halve per_device_train_batch_size, double gradient_accumulation_steps
#   - 12GB: quarter batch size, quadruple gradient_accumulation
training:
  none: {}
  sft:
    learning_rate: 1.0e-4
    max_steps: 500
    per_device_train_batch_size: 16  # Increased for GPU (was 8)
    gradient_accumulation_steps: 1   # Decreased (was 2); effective batch = 16
    max_length: 1024
    logging_steps: 10
    lr_scheduler_type: cosine
    warmup_steps: 15  # 0.03 * 500 = 15 (equivalent to warmup_ratio=0.03)
  grpo:
    learning_rate: 1.0e-5
    max_steps: 500
    per_device_train_batch_size: 16  # Increased for GPU; must be divisible by num_generations
    gradient_accumulation_steps: 1
    num_generations: 4               # 16/4 = 4 prompts per batch
    max_completion_length: 256
    logging_steps: 10
